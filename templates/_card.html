{% load shop_extras %}
<article class="card product" data-aos="fade-up">
  <a class="thumb cat-{{ p.category.slug }}" href="{% url 'product' p.pk %}">{% if p.image %}<img src="{{ p.image.url }}" alt="{{ p.name }}">{% else %}<span>{{ p.emoji }}</span>{% endif %}</a>
  <div class="card-body">
    <h3><a href="{% url 'product' p.pk %}">{{ p.name }}</a></h3>
    <div class="price">{{ p.price|money }} <small>{{ T.toman }}</small></div>
    <form method="post" action="{% url 'add_to_cart' p.pk %}">{% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <button class="btn btn-block"><i class="ri-shopping-cart-line"></i> {{ T.add_to_cart }}</button>
    </form>
  </div>
</article>
